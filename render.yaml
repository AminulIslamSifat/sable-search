services:
  # SearXNG — pulled directly from Docker Hub, no build step
  - type: web
    name: sable-searxng
    runtime: image
    plan: free
    region: oregon
    imageUrl: docker.io/searxng/searxng:latest
    healthCheckPath: /search?q=test&format=json
    envVars:
      - key: SEARXNG_SETTINGS_PATH
        value: "/etc/searxng/settings.yml"

  # SSE API — talks to your SearXNG via Render internal URL
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # Points to the SearXNG service deployed above
      - key: SSE_SEARXNG_URL
        value: "https://sable-searxng.onrender.com"
