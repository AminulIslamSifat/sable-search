services:
  # SearXNG — stock image, inject settings via startup command
  - type: web
    name: sable-searxng
    runtime: image
    plan: free
    region: oregon
    imageUrl: docker.io/searxng/searxng:latest
    dockerCommand: /bin/sh -c "printf 'use_default_settings: true\nsearch:\n  formats:\n    - html\n    - json\nserver:\n  limiter: false\n' > /tmp/settings.yml && SEARXNG_SETTINGS_PATH=/tmp/settings.yml exec /usr/local/searxng/dockerfiles/docker-entrypoint.sh"

  # SSE API — talks to your SearXNG via Render internal URL
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # Points to the SearXNG service deployed above
      - key: SSE_SEARXNG_URL
        value: "https://sable-searxng.onrender.com"
