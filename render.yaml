services:
  # SearXNG — stock Docker image, no custom config
  - type: web
    name: sable-searxng
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.searxng
    dockerContext: ./searxng

  # SSE API — proxies SearXNG on port 8080 through its own public URL
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # Public URL — Render services can't resolve each other by hostname
      - key: SSE_SEARXNG_URL
        value: "https://sable-searxng.onrender.com"
