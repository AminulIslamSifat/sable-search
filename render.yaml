services:
  # SearXNG — stock image, settings injected at startup
  - type: web
    name: sable-searxng
    runtime: image
    plan: free
    region: oregon
    imageUrl: docker.io/searxng/searxng:latest
    dockerCommand: >-
      /bin/sh -c "printf 'use_default_settings: true\nsearch:\n  formats:\n    - html\n    - json\nserver:\n  limiter: false\n' > /etc/searxng/settings.yml && exec searxng-run"

  # SSE API — proxies SearXNG on port 8080 through its own public URL
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # Public URL — Render services can't resolve each other by hostname
      - key: SSE_SEARXNG_URL
        value: "https://sable-searxng.onrender.com"
