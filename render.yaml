services:
  # SearXNG — stock image, no custom config needed
  - type: web
    name: sable-searxng
    runtime: image
    plan: free
    region: oregon
    imageUrl: docker.io/searxng/searxng:latest

  # SSE API — talks to your SearXNG via Render internal URL
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # Points to the SearXNG service deployed above
      - key: SSE_SEARXNG_URL
        value: "https://sable-searxng.onrender.com"
