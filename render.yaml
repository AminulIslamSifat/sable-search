services:
  # SearXNG — your own private search engine
  - type: web
    name: sable-searxng
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.searxng
    dockerContext: ./searxng
    envVars:
      - key: PORT
        value: "8080"

  # SSE API — talks to your SearXNG internally
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # After deploying, set this to your SearXNG Render URL
      - key: SSE_SEARXNG_URL
        sync: false
