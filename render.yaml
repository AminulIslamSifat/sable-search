services:
  # SearXNG — your own private search engine (Docker)
  - type: web
    name: sable-searxng
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.searxng
    dockerContext: ./searxng
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"

  # SSE API — talks to your SearXNG via Render internal URL
  - type: web
    name: sable-search
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ."
    startCommand: "python server.py"
    envVars:
      - key: SSE_HOST
        value: "0.0.0.0"
      - key: SSE_DEFAULT_PROVIDER
        value: "searxng"
      # Points to the SearXNG service deployed above
      - key: SSE_SEARXNG_URL
        value: "https://sable-searxng.onrender.com"
